# Docker Compose configuration for Rakshak Expense Management System

services:
  # MongoDB Database
  # mongodb:
  #   image: mongo:7.0
  #   container_name: rakshak-mongodb
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: password123
  #     MONGO_INITDB_DATABASE: rakshak-expense
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #     - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  #   networks:
  #     - rakshak-network
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakshak-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb+srv://subvivah:matrimony%40123@cluster0.2wmxzb7.mongodb.net/rakshak-expense?retryWrites=true&w=majority&appName=Cluster0
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRE=1d
      - BCRYPT_ROUNDS=12
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "5001:5001"
    # depends_on:
    #   mongodb:
    #     condition: service_healthy
    volumes:
      - app_logs:/app/backend/logs
      - uploads:/app/backend/uploads
    networks:
      - rakshak-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: rakshak-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - rakshak-network
    profiles:
      - production

volumes:
  mongodb_data:
    driver: local
  app_logs:
    driver: local
  uploads:
    driver: local

networks:
  rakshak-network:
    driver: bridge 